name: Release

# Pushing a tag vX.Y.Z builds the signed Windows installer and publishes a GitHub Release with
# latest.json, which installed apps read to offer the update. See docs/releasing.md.
on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write # create the release and upload its files
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile

      - name: Tag matches the app version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/version.mjs --check

      - name: Release notes from CHANGELOG.md
        id: notes
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          {
            echo "body<<VB_NOTES_EOF"
            node scripts/release-notes.mjs "$RELEASE_TAG"
            echo "VB_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Signing key is configured
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY is missing (see docs/releasing.md)"
            exit 1
          fi

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Vision Board ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
