name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, to catch newly published vulnerabilities in unchanged dependencies.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan the whole history
      - name: Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .

  trivy:
    name: Dependencies and config (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

  semgrep:
    name: Static analysis (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
      - run: semgrep scan --config p/typescript --config p/react --config p/rust --config p/secrets --error --exclude src/lib/bindings.ts

  libyear:
    name: Dependency freshness (libyear)
    runs-on: ubuntu-latest
    # Informational: reports how outdated dependencies are, never fails the build.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: npm dependencies
        run: npx --yes libyear --all 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust dependencies
        run: |
          cargo install cargo-libyear --locked
          cargo libyear --manifest-path src-tauri/Cargo.toml 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
