[package]
name = "vision-board"
version = "0.1.0"
description = "Vision Board â€“ personal vision board desktop app"
authors = ["Almost-there.eu"]
edition = "2021"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vision_board_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2.4.5"
tauri-plugin-window-state = "2.4.1"
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }
specta = "=2.0.0-rc.25"
specta-typescript = "0.0.12"
rusqlite_migration = "2.6"
rusqlite = { version = "0.40.2", features = ["bundled"] }
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
webp = "0.3"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
sys-locale = "0.3"
tokio = { version = "1", features = ["sync", "time"] }
# Local time for the popup schedule; already in the tree (through tauri), so no new code.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Validating hotspot links (http/https only); already in the tree through tauri.
url = "2"
# Start at login through the OS mechanism (HKCU Run, LaunchAgent, XDG autostart); adds only
# auto-launch + winreg. Pinned: newer releases require Tauri 2.12.
tauri-plugin-autostart = "=2.5.1"
# Opens hotspot links in the default browser (from Rust only, no JS permissions). Pinned:
# newer releases require Tauri 2.12.
tauri-plugin-opener = "=2.5.0"

# Already compiled for tao/wry (same version and features), so this adds no code of its own.
[target.'cfg(windows)'.dependencies]
# WebView2 snapshot of the board for the wallpaper (CapturePreview); same version as wry uses.
webview2-com = "0.38"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Memory",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Abort keeps the binary small: unwinding costs +4.3 MB (7.4 â†’ 11.8 MB, measured 2026-10-08).
# The price is that a decoder panic on a malformed image ends the app (the board loses at most
# the last second of edits); the pure-Rust decoders are fuzzed upstream.
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[dev-dependencies]
tempfile = "3.27.0"

# Dependencies (image decoding, WebP, SQLite) are far too slow unoptimized: a 12 MP photo
# takes over a minute in a plain debug build. Our own crate stays at opt-level 0 for fast builds.
[profile.dev.package."*"]
opt-level = 2
