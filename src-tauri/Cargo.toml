[package]
name = "vision-board"
version = "0.1.0"
description = "Vision Board – personal vision board desktop app"
authors = ["Almost-there.eu"]
edition = "2021"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vision_board_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2.4.5"
tauri-plugin-window-state = "2.4.1"
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }
specta = "=2.0.0-rc.25"
specta-typescript = "0.0.12"
rusqlite_migration = "2.6"
rusqlite = { version = "0.40.2", features = ["bundled"] }
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
webp = "0.3"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
sys-locale = "0.3"
tokio = { version = "1", features = ["sync", "time"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[dev-dependencies]
tempfile = "3.27.0"

# Dependencies (image decoding, WebP, SQLite) are far too slow unoptimized: a 12 MP photo
# takes over a minute in a plain debug build. Our own crate stays at opt-level 0 for fast builds.
[profile.dev.package."*"]
opt-level = 2
